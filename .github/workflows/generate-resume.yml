name: Generate resume

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pipeline
        run: pnpm generate
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_DOC_ID: ${{ secrets.GOOGLE_DOC_ID }}

      - name: Open PR with regenerated resume.json
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: resume.json
          commit-message: "chore: regenerate resume.json"
          branch: pipeline/regenerate-resume
          title: "chore: regenerate resume.json"
          body: Automated resume.json regeneration from the source Google Doc.
